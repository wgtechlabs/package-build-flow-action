name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot-detection-script:
    name: Bot Detection Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Assert bot detection script behavior
        shell: bash
        run: |
          set -euo pipefail

          run_case() {
            local actor="$1"
            local bot_detection="$2"
            local expected_is_bot="$3"
            local expected_reason="$4"
            local output_file

            output_file=$(mktemp)
            ACTOR="$actor" BOT_DETECTION="$bot_detection" GITHUB_OUTPUT="$output_file" bash ./scripts/detect-bot-actor.sh

            test "$(grep '^is-bot=' "$output_file" | cut -d= -f2)" = "$expected_is_bot"

            if [ -n "$expected_reason" ]; then
              test "$(grep '^build-skip-reason=' "$output_file" | cut -d= -f2-)" = "$expected_reason"
            else
              ! grep -q '^build-skip-reason=' "$output_file"
            fi

            rm -f "$output_file"
          }

          run_case "dependabot[bot]" "true" "true" "Bot actor: dependabot[bot]"
          run_case "renovate[bot]" "true" "true" "Bot actor: renovate[bot]"
          run_case "github-actions[bot]" "true" "true" "Bot actor: github-actions[bot]"
          run_case "warengonzaga" "true" "false" ""
          run_case "dependabot[bot]" "false" "false" ""

  package-path-resolution:
    name: Package Path Resolution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare local action copy and consumer fixture
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p local-action
          rsync -a --exclude '.git' --exclude 'local-action' ./ ./local-action/

          cat > package.json <<'EOF'
          {
           "name": "@wgtechlabs/path-resolution-fixture",
           "version": "0.1.0",
           "scripts": {
             "build": "echo path-resolution-build",
             "test": "echo path-resolution-test"
           }
          }
          EOF

      - name: Run action from nested action path
        id: nested-action
        uses: ./local-action
        with:
          package-manager: npm
          registry: github
          github-token: ${{ github.token }}
          publish-enabled: 'false'
          audit-enabled: 'false'
          pr-comment-enabled: 'false'

      - name: Assert checkout-required resolver detection
        shell: bash
        run: |
          set -euo pipefail

          run_resolver() {
            local pkg_path="$1"
            local pkg_paths="${2:-}"
            local out
            out=$(mktemp)
            PACKAGE_PATH="$pkg_path" PACKAGE_PATHS="$pkg_paths" \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$out" \
              bash ./scripts/resolve-package-paths.sh > /dev/null
            grep '^checkout-required=' "$out" | cut -d= -f2
            rm -f "$out"
          }

          # relative path to missing file → checkout required
          test "$(run_resolver "./nonexistent-package.json")" = "true"

          # absolute path under GITHUB_WORKSPACE to missing file → checkout required
          test "$(run_resolver "$GITHUB_WORKSPACE/nonexistent-package.json")" = "true"

          # absolute path outside GITHUB_WORKSPACE → checkout not required
          test "$(run_resolver "/tmp/nonexistent-package.json")" = "false"

          # existing file (relative) → checkout not required
          test "$(run_resolver "./package.json")" = "false"

      - name: Assert nested action outputs
        shell: bash
        run: |
          test "${{ steps.nested-action.outputs.build-skipped }}" = "false"
          test -n "${{ steps.nested-action.outputs.package-version }}"
          test "${{ steps.nested-action.outputs.github-published }}" = "false"

  planned-package-publishing:
    name: Planned Package Publishing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Assert planned version publishing behavior
        shell: bash
        run: |
          set -euo pipefail

          run_case() {
              local registry="$1"
              local npm_result="$2"
              local github_result="$3"
              local expected_exit="$4"
              local expected_npm="$5"
              local expected_github="$6"
              local output_file
              local fixture_dir
              local bin_dir
              local actual_exit=0

              output_file=$(mktemp)
              fixture_dir=$(mktemp -d)
              bin_dir=$(mktemp -d)
              printf '%s\n' '{"name":"planned-publish-fixture","version":"0.1.0"}' > "$fixture_dir/package.json"
              printf '%s\n' '#!/bin/bash' \
                'if [ "$1" = "install" ]; then exit 0; fi' \
                'if [ "$1" = "publish" ]; then' \
                '  case "$*" in' \
                '    *registry.npmjs.org*) exit "${NPM_RESULT}" ;;' \
                '    *npm.pkg.github.com*) exit "${GITHUB_RESULT}" ;;' \
                '  esac' \
                'fi' \
                'exit 1' > "$bin_dir/npm"
              chmod +x "$bin_dir/npm"

              PATH="$bin_dir:$PATH" \
              PACKAGE_PATH="$fixture_dir/package.json" \
              PACKAGE_VERSION="1.2.3-rc.1" \
              NPM_TAG="rc" \
              PKG_MANAGER="npm" \
              PACKAGE_MANAGER="npm" \
              BUILD_SCRIPT="" \
              PUBLISH_ENABLED="true" \
              PLANNED_PUBLISH="true" \
              DRY_RUN="false" \
              REGISTRY="$registry" \
              NPM_REGISTRY_URL="https://registry.npmjs.org" \
              GITHUB_REGISTRY_URL="https://npm.pkg.github.com" \
              GITHUB_REPOSITORY_OWNER="wgtechlabs" \
              ACCESS="public" \
              NPM_RESULT="$npm_result" \
              GITHUB_RESULT="$github_result" \
              GITHUB_OUTPUT="$output_file" \
              bash ./scripts/build-and-publish.sh || actual_exit=$?

              test "$actual_exit" = "$expected_exit"
              test "$(grep '^npm-published=' "$output_file" | cut -d= -f2)" = "$expected_npm"
              test "$(grep '^github-published=' "$output_file" | cut -d= -f2)" = "$expected_github"
              test "$(grep '^artifact-published=' "$output_file" | cut -d= -f2)" = "$([ "$expected_npm" = true ] || [ "$expected_github" = true ] && echo true || echo false)"
              test "$(jq -r '.version' "$fixture_dir/package.json")" = "1.2.3-rc.1"

              rm -rf "$fixture_dir" "$bin_dir"
              rm -f "$output_file"
          }

          run_case "npm" 0 1 0 true false
          run_case "npm" 1 1 1 false false
          run_case "github" 1 0 0 false true
          run_case "github" 1 1 1 false false
          run_case "both" 1 1 1 false false
          run_case "both" 0 1 0 true false

      - name: Assert planned input validation, main push, and legacy release flow
        shell: bash
        run: |
          set -euo pipefail

          output_file=$(mktemp)
            fixture_dir=$(mktemp -d)
            printf '%s\n' '{"name":"planned-publish-fixture","version":"0.1.0"}' > "$fixture_dir/package.json"

            main_context='{"event_name":"push","ref_name":"main","sha":"0123456789abcdef"}'
            if GITHUB_CONTEXT="$main_context" MAIN_BRANCH="main" DEV_BRANCH="dev" PACKAGE_PATH="$fixture_dir/package.json" PLANNED_VERSION="1.2" PLANNED_NPM_TAG="rc" GITHUB_OUTPUT="$output_file" bash ./scripts/detect-package-flow.sh; then
              exit 1
            fi
            if GITHUB_CONTEXT="$main_context" MAIN_BRANCH="main" DEV_BRANCH="dev" PACKAGE_PATH="$fixture_dir/package.json" PLANNED_VERSION="1.2.3-rc.01" PLANNED_NPM_TAG="rc" GITHUB_OUTPUT="$output_file" bash ./scripts/detect-package-flow.sh; then
              exit 1
            fi
            if GITHUB_CONTEXT="$main_context" MAIN_BRANCH="main" DEV_BRANCH="dev" PACKAGE_PATH="$fixture_dir/package.json" PLANNED_VERSION="1.2.3-rc.1" GITHUB_OUTPUT="$output_file" bash ./scripts/detect-package-flow.sh; then
              exit 1
            fi

            GITHUB_CONTEXT="$main_context" MAIN_BRANCH="main" DEV_BRANCH="dev" PACKAGE_PATH="$fixture_dir/package.json" \
            PLANNED_VERSION="1.2.3-rc.1" PLANNED_NPM_TAG="rc" \
            GITHUB_OUTPUT="$output_file" bash ./scripts/detect-package-flow.sh
            test "$(grep '^version=' "$output_file" | tail -1 | cut -d= -f2)" = "1.2.3-rc.1"
            test "$(grep '^npm-tag=' "$output_file" | tail -1 | cut -d= -f2)" = "rc"
            test "$(grep '^planned-publish=' "$output_file" | tail -1 | cut -d= -f2)" = "true"

            GITHUB_CONTEXT='{"event_name":"release","sha":"0123456789abcdef","event":{"release":{"tag_name":"v1.2.3","prerelease":false}}}' \
            MAIN_BRANCH="main" DEV_BRANCH="dev" PACKAGE_PATH="$fixture_dir/package.json" \
            GITHUB_OUTPUT="$output_file" bash ./scripts/detect-package-flow.sh
            test "$(grep '^version=' "$output_file" | tail -1 | cut -d= -f2)" = "1.2.3"
            test "$(grep '^npm-tag=' "$output_file" | tail -1 | cut -d= -f2)" = "latest"

            rm -rf "$fixture_dir"
          rm -f "$output_file"

  planned-monorepo-publishing:
    name: Planned Monorepo Publishing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Assert planned package versions and aggregate publishing
        shell: bash
        run: |
          set -euo pipefail

          run_case() {
            local npm_a_result="$1"
            local npm_b_result="$2"
            local github_a_result="$3"
            local github_b_result="$4"
            local expected_exit="$5"
            local expected_artifact="$6"
            local fixture_dir bin_dir output_file build_results actual_exit=0

            fixture_dir=$(mktemp -d)
            bin_dir=$(mktemp -d)
            output_file=$(mktemp)
            mkdir -p "$fixture_dir/packages/pkg-a" "$fixture_dir/packages/pkg-b"
            printf '%s\n' '{"name":"planned-monorepo-a","version":"0.1.0"}' > "$fixture_dir/packages/pkg-a/package.json"
            printf '%s\n' '{"name":"planned-monorepo-b","version":"0.1.0"}' > "$fixture_dir/packages/pkg-b/package.json"
            printf '%s\n' '#!/bin/bash' \
              'if [ "$1" = "install" ]; then exit 0; fi' \
              'if [ "$1" = "publish" ]; then' \
              '  case "$*" in' \
              '    *registry.npmjs.org*) case "$PWD" in *pkg-a) exit "${NPM_A_RESULT}" ;; *) exit "${NPM_B_RESULT}" ;; esac ;;' \
              '    *npm.pkg.github.com*) case "$PWD" in *pkg-a) exit "${GITHUB_A_RESULT}" ;; *) exit "${GITHUB_B_RESULT}" ;; esac ;;' \
              '  esac' \
              'fi' \
              'exit 1' > "$bin_dir/npm"
            chmod +x "$bin_dir/npm"

            PATH="$bin_dir:$PATH" \
            GITHUB_CONTEXT='{"event_name":"push","ref_name":"main","sha":"0123456789abcdef"}' \
            MAIN_BRANCH="main" \
            DEV_BRANCH="dev" \
            PACKAGE_PATHS="$fixture_dir/packages/pkg-a/package.json,$fixture_dir/packages/pkg-b/package.json" \
            WORKSPACE_DETECTION="false" \
            CHANGED_ONLY="false" \
            DEPENDENCY_ORDER="false" \
            BUILD_SCRIPT="" \
            PACKAGE_MANAGER="npm" \
            REGISTRY="both" \
            NPM_TOKEN="test" \
            NPM_REGISTRY_URL="https://registry.npmjs.org" \
            GITHUB_TOKEN="test" \
            GITHUB_REGISTRY_URL="https://npm.pkg.github.com" \
            GITHUB_REPOSITORY_OWNER="wgtechlabs" \
            PUBLISH_ENABLED="true" \
            DRY_RUN="false" \
            ACCESS="public" \
            AUDIT_ENABLED="false" \
            ACTION_PATH="$GITHUB_WORKSPACE" \
            PLANNED_NPM_TAG="rc" \
            PLANNED_PACKAGE_VERSIONS='[{"name":"planned-monorepo-a","path":"'"$fixture_dir"'/packages/pkg-a","oldVersion":"0.1.0","version":"1.2.3","bumpType":"minor","tag":"planned-monorepo-a@1.2.3"},{"name":"planned-monorepo-b","path":"'"$fixture_dir"'/packages/pkg-b","oldVersion":"0.1.0","version":"2.3.4","bumpType":"minor","tag":"planned-monorepo-b@2.3.4"}]' \
            NPM_A_RESULT="$npm_a_result" \
            NPM_B_RESULT="$npm_b_result" \
            GITHUB_A_RESULT="$github_a_result" \
            GITHUB_B_RESULT="$github_b_result" \
            GITHUB_OUTPUT="$output_file" \
            bash ./scripts/monorepo-orchestrator.sh || actual_exit=$?

            test "$actual_exit" = "$expected_exit"
            build_results=$(grep '^build-results=' "$output_file" | cut -d= -f2-)
            test "$(grep '^artifact-published=' "$output_file" | tail -1 | cut -d= -f2)" = "$expected_artifact"
            MONOREPO_MODE="true" BUILD_RESULTS_JSON="$build_results" CHANGED_PACKAGES_JSON="[]" GITHUB_OUTPUT="$output_file" \
              bash ./scripts/generate-outputs.sh
            test "$(grep '^artifact-published=' "$output_file" | tail -1 | cut -d= -f2)" = "$expected_artifact"
            test "$(jq -r '.version' "$fixture_dir/packages/pkg-a/package.json")" = "1.2.3"
            test "$(jq -r '.version' "$fixture_dir/packages/pkg-b/package.json")" = "2.3.4"

            rm -rf "$fixture_dir" "$bin_dir"
            rm -f "$output_file"
          }

          run_case 0 1 1 1 0 true
          run_case 1 1 1 1 1 false

          fixture_dir=$(mktemp -d)
          bin_dir=$(mktemp -d)
          output_file=$(mktemp)
          mkdir -p "$fixture_dir/packages/pkg"
          printf '%s\n' '{"name":"planned-monorepo-non-main","version":"0.1.0"}' > "$fixture_dir/packages/pkg/package.json"
          printf '%s\n' '#!/bin/bash' 'if [ "$1" = "install" ]; then exit 0; fi' 'exit 1' > "$bin_dir/npm"
          chmod +x "$bin_dir/npm"

          PATH="$bin_dir:$PATH" \
          GITHUB_CONTEXT='{"event_name":"push","ref_name":"dev","sha":"0123456789abcdef"}' \
          MAIN_BRANCH="main" \
          DEV_BRANCH="dev" \
          PACKAGE_PATHS="$fixture_dir/packages/pkg/package.json" \
          WORKSPACE_DETECTION="false" \
          CHANGED_ONLY="false" \
          DEPENDENCY_ORDER="false" \
          BUILD_SCRIPT="" \
          PACKAGE_MANAGER="npm" \
          REGISTRY="npm" \
          PUBLISH_ENABLED="false" \
          DRY_RUN="false" \
          ACCESS="public" \
          AUDIT_ENABLED="false" \
          ACTION_PATH="$GITHUB_WORKSPACE" \
          PLANNED_NPM_TAG="rc" \
          PLANNED_PACKAGE_VERSIONS='[{"name":"planned-monorepo-non-main","path":"'"$fixture_dir"'/packages/pkg","version":"1.2.3"}]' \
          GITHUB_OUTPUT="$output_file" \
          bash ./scripts/monorepo-orchestrator.sh

          test "$(jq -r '.version' "$fixture_dir/packages/pkg/package.json")" = "0.1.0-dev.0123456"
          rm -rf "$fixture_dir" "$bin_dir"
          rm -f "$output_file"

  single-package-bun:
    name: Single Package Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare single-package fixture
        shell: bash
        run: |
          mkdir -p ci-fixtures/single
          cat > ci-fixtures/single/package.json <<'EOF'
          {
            "name": "@wgtechlabs/single-bun-fixture",
            "version": "0.1.0",
            "dependencies": {
              "is-number": "7.0.0"
            },
            "scripts": {
              "build": "echo single-build",
              "test": "echo single-test"
            }
          }
          EOF

          pushd ci-fixtures/single >/dev/null
          bun install
          popd >/dev/null

      - name: Block Node fallback for Bun validation
        shell: bash
        run: |
          mkdir -p ci-bin
          cat > ci-bin/node <<'EOF'
          #!/bin/sh
          echo "node should not be used in Bun CI validation" >&2
          exit 1
          EOF
          chmod +x ci-bin/node
          echo "$PWD/ci-bin" >> "$GITHUB_PATH"

      - name: Run action against single-package fixture
        id: single
        uses: ./
        with:
          package-path: ./ci-fixtures/single/package.json
          package-manager: bun
          registry: github
          github-token: ${{ github.token }}
          publish-enabled: 'false'
          audit-enabled: 'true'
          pr-comment-enabled: 'false'

      - name: Assert single-package outputs
        shell: bash
        run: |
          test "${{ steps.single.outputs.build-skipped }}" = "false"
          test -n "${{ steps.single.outputs.package-version }}"
          test -n "${{ steps.single.outputs.build-flow-type }}"
          test "${{ steps.single.outputs.audit-completed }}" = "true"
          test "${{ steps.single.outputs.github-published }}" = "false"

  single-package-bot-validation:
    name: Single Package Bot Validation
    if: github.event_name == 'pull_request' && endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare bot-validation fixture
        shell: bash
        run: |
          mkdir -p ci-fixtures/bot-single
          cat > ci-fixtures/bot-single/package.json <<'EOF'
          {
            "name": "@wgtechlabs/bot-bun-fixture",
            "version": "0.1.0",
            "dependencies": {
              "is-number": "7.0.0"
            },
            "scripts": {
              "build": "echo bot-build",
              "test": "echo bot-test"
            }
          }
          EOF

          pushd ci-fixtures/bot-single >/dev/null
          bun install
          popd >/dev/null

      - name: Block Node fallback for Bun validation
        shell: bash
        run: |
          mkdir -p ci-bin
          cat > ci-bin/node <<'EOF'
          #!/bin/sh
          echo "node should not be used in Bun CI validation" >&2
          exit 1
          EOF
          chmod +x ci-bin/node
          echo "$PWD/ci-bin" >> "$GITHUB_PATH"

      - name: Run action against bot fixture
        id: bot-single
        uses: ./
        with:
          package-path: ./ci-fixtures/bot-single/package.json
          package-manager: bun
          registry: github
          github-token: ${{ github.token }}
          publish-enabled: 'true'
          dry-run: 'false'
          audit-enabled: 'true'
          pr-comment-enabled: 'false'

      - name: Assert bot validation outputs
        shell: bash
        run: |
          test "${{ steps.bot-single.outputs.bot-detected }}" = "true"
          test "${{ steps.bot-single.outputs.build-skipped }}" = "false"
          test -n "${{ steps.bot-single.outputs.package-version }}"
          test -n "${{ steps.bot-single.outputs.build-flow-type }}"
          test "${{ steps.bot-single.outputs.audit-completed }}" = "true"
          test "${{ steps.bot-single.outputs.github-published }}" = "dry-run"

  monorepo-bun:
    name: Monorepo Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare monorepo fixture
        shell: bash
        run: |
          mkdir -p ci-fixtures/monorepo/packages/pkg-a
          mkdir -p ci-fixtures/monorepo/packages/pkg-b

          cat > ci-fixtures/monorepo/package.json <<'EOF'
          {
            "name": "bun-monorepo-fixture",
            "private": true,
            "workspaces": [
              "packages/*"
            ]
          }
          EOF

          cat > ci-fixtures/monorepo/packages/pkg-a/package.json <<'EOF'
          {
            "name": "@wgtechlabs/pkg-a",
            "version": "0.1.0",
            "scripts": {
              "build": "echo pkg-a-build",
              "test": "echo pkg-a-test"
            }
          }
          EOF

          cat > ci-fixtures/monorepo/packages/pkg-b/package.json <<'EOF'
          {
            "name": "@wgtechlabs/pkg-b",
            "version": "0.1.0",
            "dependencies": {
              "@wgtechlabs/pkg-a": "workspace:*"
            },
            "scripts": {
              "build": "echo pkg-b-build",
              "test": "echo pkg-b-test"
            }
          }
          EOF

          pushd ci-fixtures/monorepo >/dev/null
          bun install
          popd >/dev/null

      - name: Block Node fallback for Bun validation
        shell: bash
        run: |
          mkdir -p ci-bin
          cat > ci-bin/node <<'EOF'
          #!/bin/sh
          echo "node should not be used in Bun CI validation" >&2
          exit 1
          EOF
          chmod +x ci-bin/node
          echo "$PWD/ci-bin" >> "$GITHUB_PATH"

      - name: Run action against monorepo fixture
        id: monorepo
        uses: ./
        with:
          monorepo: 'true'
          package-path: ./ci-fixtures/monorepo/package.json
          package-manager: bun
          registry: github
          github-token: ${{ github.token }}
          publish-enabled: 'false'
          audit-enabled: 'true'
          pr-comment-enabled: 'false'
          changed-only: 'false'
          dependency-order: 'true'

      - name: Assert monorepo outputs
        shell: bash
        env:
          BUILD_RESULTS: ${{ steps.monorepo.outputs.build-results }}
          TOTAL_PACKAGES: ${{ steps.monorepo.outputs.total-packages }}
          PACKAGES_FAILED: ${{ steps.monorepo.outputs.packages-failed }}
        run: |
          test "$TOTAL_PACKAGES" = "2"
          test -z "$PACKAGES_FAILED"
          test "$(echo "$BUILD_RESULTS" | jq -r 'length')" = "2"
          test "$(echo "$BUILD_RESULTS" | jq -r '.[0].name')" = "@wgtechlabs/pkg-a"
          test "$(echo "$BUILD_RESULTS" | jq -r '.[1].name')" = "@wgtechlabs/pkg-b"
          test "$(echo "$BUILD_RESULTS" | jq -r '[.[].result] | all(. == "success")')" = "true"
          test "$(echo "$BUILD_RESULTS" | jq -r '[.[]."github-published"] | all(. == "false")')" = "true"